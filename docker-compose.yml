# Full self-host stack: nginx (path-based reverse proxy) + web (Next.js) +
# api (NestJS) + postgres. For local dev via `pnpm dev` (no containers for
# web/api) use apps/api/docker-compose.yml instead, which only brings up
# postgres — don't run both at once, they both bind 5432 by default.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nestjs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nestjs_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nestjs} -d ${POSTGRES_DB:-nestjs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides the .env value (which points at localhost, for non-docker dev)
      # with the in-network postgres hostname.
      DATABASE_URL: postgresql://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs_secret}@postgres:5432/${POSTGRES_DB:-nestjs_db}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides the .env value (localhost:5000) so the rewrites in
      # next.config.ts reach the api container over the docker network.
      API_ORIGIN: http://api:5000
      # .env's PORT=5000 is meant for the api service; env_file leaks it here
      # too and next start would otherwise listen on 5000 instead of 3000.
      PORT: 3000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
