# Path-based reverse proxy in front of web (Next.js) + api (NestJS).
# Same domain for both, so JWT cookies from apps/api aren't cross-site.
# apps/web's next.config.ts rewrites do the same /api/* forwarding for
# `pnpm dev`/Vercel — here nginx intercepts first, so those rewrites
# never actually fire for this stack, but stay harmless if they did.

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Docker's embedded DNS. Using $variables in proxy_pass (below) makes nginx
    # re-resolve api/web through it on each request instead of caching the IP
    # from container start — otherwise redeploying just api or web (recreating
    # the container, new IP) leaves nginx serving 502s until it's restarted too.
    resolver 127.0.0.11 valid=10s;

    # NestJS (global prefix "api", plus /health and /docs at the root)
    location /api/ {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
    }

    location /health {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
    }

    location /docs {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
    }

    # Next.js — also carries the upgrade headers for HMR/websocket tester
    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
