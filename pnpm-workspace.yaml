packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - eslint-plugin-jest@29.16.2
overrides:
  # migrated from apps/api's yarn "resolutions" (security pins for transitive deps) —
  # pnpm ignores "resolutions" entirely, so these need to live here instead.
  # sharp is pinned past next's declared ^0.34.5 range: next doesn't use next/image
  # here, so the unused optional dep is forced to a patched version for hygiene.
  sharp: ^0.35.3
  '@babel/core': ^7.29.6
  handlebars: ^4.7.9
  piscina: ^4.9.3
  '@xhmikosr/decompress': ^10.2.1
  file-type: ^21.3.4
  yauzl: ^3.2.1
  fast-uri: ^3.1.5
  postcss: ^8.5.23
  # postcss's own dependency, not ours — GHSA-mwcw-c2x4-8c55 affects <3.3.18.
  nanoid: ^3.3.18
  serialize-javascript: ^7.0.5
  flatted: ^3.4.2
  form-data: ^4.0.6
  '@angular-devkit/core>ajv': ^8.18.0
  '@angular-devkit/core>picomatch': ^4.0.4
  'tinyglobby>picomatch': ^4.0.4
  'jest-util>picomatch': ^2.3.2
  'micromatch>picomatch': ^2.3.2
  'anymatch>picomatch': ^2.3.2
  '@eslint/eslintrc>js-yaml': ^4.3.1
  'cosmiconfig>js-yaml': ^4.3.1
  '@istanbuljs/load-nyc-config>js-yaml': ^3.15.1
  '@nestjs/swagger>js-yaml': ^5.2.2
  'node-emoji>lodash': ^4.18.0
  'eslint>brace-expansion': ^1.1.17
  '@eslint/eslintrc>brace-expansion': ^1.1.17
  'jest>brace-expansion': ^1.1.17
  '@nestjs/cli>brace-expansion': ^5.0.9
  'fork-ts-checker-webpack-plugin>brace-expansion': ^1.1.17
  '@typescript-eslint/eslint-plugin>brace-expansion': ^5.0.9
  '@swc/cli>brace-expansion': ^2.1.4
  'typeorm>brace-expansion': ^2.1.4
  # Same story as above but for minimatch itself, which depends on
  # brace-expansion directly rather than through one of the parents pinned
  # above — three coexisting major lines (1.x/2.x/5.x) each need their own
  # edge since a flat override would force one version onto all of them.
  'minimatch@3>brace-expansion': ^1.1.17
  'minimatch@9>brace-expansion': ^2.1.4
  'minimatch@10>brace-expansion': ^5.0.9
